openapi: 3.1.0
info:
  title: newsscore
  version: 1.0.0
  description: |
    NewsScore API: skor langsung dan berita sepak bola.

    All errors use the `Error` schema. Every response carries an `X-Request-ID`
    header (client-supplied if it matches `^[A-Za-z0-9._-]{1,64}$`, otherwise generated).

servers:
  - url: http://localhost:8080
    description: Local

tags:
  - name: auth
    description: "Login with an HttpOnly session cookie (`session`). Browsers must send `credentials: include`."
  - name: news
    description: Berita. `/admin/news` needs a session with the admin role.
  - name: leagues
    description: Competitions (Super League, Championship, Piala Presiden) and tables computed from finished matches.
  - name: teams
    description: Team and player pages, from lineups and incidents of the latest season.
  - name: search
    description: Typo-tolerant name search (pg_trgm).
  - name: matches
    description: Pertandingan sepak bola. Tanggal dalam zona WIB.
  - name: health
    description: Liveness and readiness probes for orchestrators and load balancers.

security: []

paths:
  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Sign in; sets the session cookie
      description: Limited to 10 attempts per IP per minute.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, maxLength: 1024 }
      responses:
        "200":
          description: Signed in
          headers:
            Set-Cookie:
              description: "`session=<token>; HttpOnly; SameSite=Lax; Secure` (Secure outside development)"
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [user]
                    properties:
                      user: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Wrong email or password (`INVALID_CREDENTIALS`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Sign out; deletes the session and clears the cookie
      responses:
        "204": { description: Signed out (also when no session was present) }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/me:
    get:
      tags: [auth]
      operationId: me
      summary: The signed-in user
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/news:
    get:
      tags: [news]
      operationId: listNews
      summary: Published news, newest first
      parameters:
        - { name: matchId, in: query, schema: { type: string, format: uuid } }
        - { name: teamId, in: query, schema: { type: string, format: uuid } }
        - { name: playerId, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: cursor, in: query, description: "`meta.nextCursor` from the previous page", schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/NewsItem" } }
                  meta:
                    type: object
                    required: [nextCursor]
                    properties:
                      nextCursor: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/news/{slug}:
    get:
      tags: [news]
      operationId: getNews
      summary: One published article with its body
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf:
                      - $ref: "#/components/schemas/NewsItem"
                      - type: object
                        required: [body]
                        properties:
                          body: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/admin/news:
    get:
      tags: [news]
      operationId: adminListNews
      summary: Latest 100 articles, drafts included
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/AdminNews" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [news]
      operationId: adminCreateNews
      summary: Create an article (draft unless `published`)
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewsWrite" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/AdminNews" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/SlugTaken" }

  /api/v1/admin/news/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [news]
      operationId: adminGetNews
      summary: One article with body and links, draft or not
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/AdminNews" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [news]
      operationId: adminUpdateNews
      summary: Replace fields and links; `published` keeps the first publish time
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewsWrite" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/AdminNews" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/SlugTaken" }
    delete:
      tags: [news]
      operationId: adminDeleteNews
      summary: Delete an article and its links
      security: [{ sessionCookie: [] }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/leagues:
    get:
      tags: [leagues]
      operationId: listLeagues
      summary: Competitions with their latest season
      parameters:
        - { name: standings, in: query, description: "`true` adds each competition's standings (groups for cups) in one response", schema: { type: boolean } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/League" } }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/leagues/{id}:
    get:
      tags: [leagues]
      operationId: getLeague
      summary: One competition with its table
      description: |
        Standings rank by points, goal difference, then goals scored; teams without a
        finished match appear with zeros. Cups return an empty `standings`.
      parameters:
        - { name: id, in: path, required: true, description: "Slug, e.g. super-league", schema: { type: string } }
        - { name: season, in: query, description: Year; defaults to the latest season with a finished match, schema: { type: integer, example: 2026 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/League" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/teams/{id}:
    get:
      tags: [teams]
      operationId: getTeam
      summary: Team profile, squad with season numbers, last 5 and next 5 matches
      description: Covers every competition in the latest season, or one with `leagueId`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: leagueId, in: query, description: "Competition slug; its latest season", schema: { type: string } }
        - { name: season, in: query, description: Year; defaults to the latest season with a finished match, schema: { type: integer, example: 2026 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/TeamProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/players/{id}:
    get:
      tags: [teams]
      operationId: getPlayer
      summary: Player profile, season totals, and match log (newest first)
      description: Covers every competition in the latest season, or one with `leagueId`; `competitions` splits the totals.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: leagueId, in: query, description: "Competition slug; its latest season", schema: { type: string } }
        - { name: season, in: query, description: Year; defaults to the latest season with a finished match, schema: { type: integer, example: 2026 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/PlayerProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/search:
    get:
      tags: [search]
      operationId: search
      summary: Search teams (5), players (10), and published news (5) by name
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 64 } }
      responses:
        "200":
          description: Best matches first in each group
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [teams, players, news]
                    properties:
                      teams:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string, format: uuid }
                            name: { type: string }
                            badge: { type: string }
                            logo: { type: string }
                      players:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string, format: uuid }
                            name: { type: string }
                            number: { type: integer }
                            team: { type: string }
                            photo: { type: string }
                      news:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string, description: Slug }
                            title: { type: string }
                            category: { type: string }
                            publishedAt: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/matches:
    get:
      tags: [matches]
      operationId: listMatches
      summary: Pertandingan pada satu tanggal (WIB), urut jam kick-off
      parameters:
        - { name: date, in: query, description: "`DD.MM.YYYY`, default hari ini (WIB). Tidak boleh bersama from/to.", schema: { type: string, example: "14.09.2026" } }
        - { name: from, in: query, description: "Awal rentang `DD.MM.YYYY` (WIB), wajib bersama `to`", schema: { type: string, example: "14.09.2026" } }
        - { name: to, in: query, description: "Akhir rentang, inklusif; paling lama 31 hari dari `from`", schema: { type: string, example: "20.09.2026" } }
        - { name: teamId, in: query, schema: { type: string, format: uuid } }
        - { name: leagueId, in: query, description: Competition slug, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/MatchStatus" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Match" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/matches/stream:
    get:
      tags: [matches]
      operationId: streamMatches
      summary: Server-Sent Events for live matches
      description: |
        One stream for every match; clients filter by `id`/`matchId`. Events:

        - `score`: `ScoreUpdate`, sent when status, stage, or score changes.
        - `match_event`: `MatchEventUpdate`, sent when a new incident is recorded.

        A `: ping` comment arrives every 20s. The server closes streams after 30 minutes
        and on deploy; `EventSource` reconnects on its own (`retry: 3000`). Events missed
        while disconnected are not replayed, so refetch `/api/v1/matches` after reconnecting.
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema: { type: string }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503":
          description: Server is shutting down

  /api/v1/matches/{id}:
    get:
      tags: [matches]
      operationId: getMatch
      summary: Detail pertandingan dengan kejadian dan statistik
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/MatchDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /health:
    get:
      tags: [health]
      operationId: liveness
      summary: Liveness probe
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProbeStatus" }

  /ready:
    get:
      tags: [health]
      operationId: readiness
      summary: Readiness probe (checks the database; fails while draining)
      responses:
        "200":
          description: Ready to receive traffic
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProbeStatus" }
        "503":
          description: Not ready (`not_ready`) or shutting down (`shutting_down`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProbeStatus" }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session

  schemas:
    League:
      type: object
      required: [id, name, country, countryId, type, season]
      properties:
        id: { type: string, description: Slug }
        name: { type: string }
        country: { type: string }
        countryId: { type: string, description: 'Country slug, e.g. "indonesia"' }
        type: { type: string, enum: [league, cup] }
        season: { type: integer, description: 0 until a match is stored }
        standings: { type: array, items: { $ref: "#/components/schemas/StandingRow" }, description: "Only on GET /leagues/{id}; empty for cups" }
        groups:
          type: array
          description: |
            Cups only, on GET /leagues/{id}. Groups are derived from who played whom in the
            group stage (the source does not label them), named A, B, … by their best-ranked
            team, so the letters may differ from the official draw.
          items:
            type: object
            required: [name, standings]
            properties:
              name: { type: string, example: Grup A }
              standings: { type: array, items: { $ref: "#/components/schemas/StandingRow" } }

    TeamProfile:
      type: object
      required: [id, name, badge, season, squad, recentMatches, upcomingMatches]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        badge: { type: string }
        logo: { type: string, description: "Local path under /assets/; prefix the API base URL" }
        season: { type: integer }
        squad:
          type: array
          items:
            type: object
            required: [id, name, matches, goals, assists]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              number: { type: integer }
              position: { type: string, enum: [GK, DF, MF, FW] }
              nationality: { type: string }
              photo: { type: string, description: "Local path under /assets/; prefix the API base URL" }
              matches: { type: integer, description: Starts plus substitute appearances }
              goals: { type: integer }
              assists: { type: integer }
        recentMatches: { type: array, items: { $ref: "#/components/schemas/Match" } }
        upcomingMatches: { type: array, items: { $ref: "#/components/schemas/Match" } }

    PlayerProfile:
      type: object
      required: [id, name, team, season, competitions, matchLog]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        number: { type: integer }
        position: { type: string }
        country: { type: string }
        photo: { type: string, description: "Local path under /assets/; prefix the API base URL" }
        team:
          type: [object, "null"]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            badge: { type: string }
            logo: { type: string }
        season:
          type: object
          properties:
            season: { type: integer }
            matches: { type: integer }
            starts: { type: integer }
            goals: { type: integer }
            assists: { type: integer }
            yellow: { type: integer }
            red: { type: integer }
        competitions:
          type: array
          items:
            type: object
            properties:
              leagueId: { type: string }
              league: { type: string }
              matches: { type: integer }
              starts: { type: integer }
              goals: { type: integer }
              assists: { type: integer }
              yellow: { type: integer }
              red: { type: integer }
        matchLog:
          type: array
          items:
            type: object
            properties:
              date: { type: string, description: DD.MM.YYYY (WIB) }
              matchId: { type: string, format: uuid }
              leagueId: { type: string }
              league: { type: string }
              round: { type: string }
              home: { type: string }
              away: { type: string }
              score: { type: [array, "null"], items: { type: integer } }
              outcome: { type: string, enum: [W, D, L, ""] }
              started: { type: boolean }
              played: { type: boolean, description: false when on the bench and never came on }
              goals: { type: integer }
              assists: { type: integer }
              yellow: { type: integer }
              red: { type: integer }

    StandingRow:
      type: object
      required: [position, teamId, team, badge, played, won, drawn, lost, goalsFor, goalsAgainst, points, form]
      properties:
        position: { type: integer }
        teamId: { type: string, format: uuid }
        team: { type: string }
        badge: { type: string }
        logo: { type: string, description: "Local path under /assets/; prefix the API base URL" }
        played: { type: integer }
        won: { type: integer }
        drawn: { type: integer }
        lost: { type: integer }
        goalsFor: { type: integer }
        goalsAgainst: { type: integer }
        points: { type: integer }
        form:
          type: array
          description: Last five results, newest first
          maxItems: 5
          items: { type: string, enum: [W, D, L] }

    NewsItem:
      type: object
      required: [id, category, title, summary, published, publishedAt]
      properties:
        id: { type: string, description: Slug }
        category: { type: string }
        title: { type: string }
        summary: { type: string }
        image: { type: string, format: uri }
        published: { type: string, description: 'Relative label: "baru saja", "2 jam lalu", or DD.MM.YYYY' }
        publishedAt: { type: string, format: date-time }

    NewsLinks:
      type: object
      properties:
        matchIds: { type: array, items: { type: string, format: uuid } }
        teamIds: { type: array, items: { type: string, format: uuid } }
        playerIds: { type: array, items: { type: string, format: uuid } }

    NewsWrite:
      type: object
      required: [title, category]
      properties:
        slug: { type: string, description: Derived from the title when empty }
        title: { type: string, maxLength: 200 }
        category: { type: string, maxLength: 40 }
        summary: { type: string, maxLength: 500 }
        body: { type: string }
        image: { type: string, description: https URL }
        published: { type: boolean, default: false }
        links: { $ref: "#/components/schemas/NewsLinks" }

    AdminNews:
      type: object
      required: [id, slug, category, title, publishedAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        category: { type: string }
        title: { type: string }
        summary: { type: string }
        body: { type: string }
        image: { type: string }
        publishedAt: { type: [string, "null"], format: date-time, description: null = draft }
        updatedAt: { type: string, format: date-time }
        links: { $ref: "#/components/schemas/NewsLinks" }

    User:
      type: object
      required: [id, email, name]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }

    MatchStatus:
      type: string
      enum: [scheduled, live, finished]

    Team:
      type: object
      required: [id, name, badge]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        badge: { type: string, description: 'Kode singkat, mis. "PER"' }
        logo: { type: string, description: "Local path under /assets/; prefix the API base URL" }

    LineupPlayer:
      type: object
      required: [playerId, name, starter]
      properties:
        playerId: { type: string, format: uuid }
        name: { type: string }
        number: { type: integer }
        starter: { type: boolean }
        photo: { type: string }

    Match:
      type: object
      required: [id, leagueId, league, status, time, date, home, away, score]
      properties:
        id: { type: string, format: uuid }
        leagueId: { type: string, description: Competition slug }
        league: { type: string }
        round: { type: string, example: Round 3 }
        status: { $ref: "#/components/schemas/MatchStatus" }
        time: { type: string, description: 'Jam kick-off WIB "HH:MM", atau "LIVE"' }
        date: { type: string, description: '"DD.MM.YYYY" (WIB)' }
        home: { $ref: "#/components/schemas/Team" }
        away: { $ref: "#/components/schemas/Team" }
        score:
          type: [array, "null"]
          items: { type: integer }
          minItems: 2
          maxItems: 2

    ScoreUpdate:
      type: object
      required: [id, status, time, score]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/MatchStatus" }
        time:
          type: string
          description: Menit berjalan saat live (`67'`, `HT`, `90+'`), kosong bila tidak live
        score:
          type: [array, "null"]
          items: { type: integer }
          minItems: 2
          maxItems: 2

    MatchEventUpdate:
      type: object
      required: [matchId, minute, team, type, player]
      properties:
        matchId: { type: string, format: uuid }
        minute: { type: string }
        team: { type: string, enum: [home, away, ""] }
        type: { type: string }
        player: { type: string }

    MatchDetail:
      allOf:
        - $ref: "#/components/schemas/Match"
        - type: object
          required: [events, stats, lineups]
          properties:
            events:
              type: array
              items:
                type: object
                required: [minute, team, type, player]
                properties:
                  minute: { type: string, example: "45+2'" }
                  team: { type: string, enum: [home, away, ""] }
                  type: { type: string, description: "goal, yellow, red, sub, atau jenis mentah dari sumber" }
                  player: { type: string }
                  assist: { type: string, description: Goals only }
                  note: { type: string, description: 'Substitutions: "Keluar: <player>"' }
            lineups:
              type: object
              properties:
                home: { type: array, items: { $ref: "#/components/schemas/LineupPlayer" } }
                away: { type: array, items: { $ref: "#/components/schemas/LineupPlayer" } }
            stats:
              type: array
              items:
                type: object
                properties:
                  label: { type: string }
                  home: { type: string }
                  away: { type: string }

    ProbeStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, ready, not_ready, shutting_down]

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              examples: [VALIDATION_ERROR, NOT_FOUND, RATE_LIMITED]
            message:
              type: string

  responses:
    BadRequest:
      description: "Invalid input (`VALIDATION_ERROR`, `CLIENT_IP_UNRESOLVED`)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Not signed in or session expired (`UNAUTHORIZED`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Signed in without the admin role (`FORBIDDEN`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    SlugTaken:
      description: Another article uses this slug (`NEWS_SLUG_TAKEN`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: "`NOT_FOUND`, `MATCH_NOT_FOUND`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PayloadTooLarge:
      description: Body over 1 MiB (`REQUEST_BODY_TOO_LARGE`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Per-client-IP rate limit exceeded (`RATE_LIMITED`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InternalError:
      description: "Unexpected failure (`INTERNAL_SERVER_ERROR`, `MATCH_QUERY_FAILED`)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
