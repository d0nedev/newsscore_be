openapi: 3.1.0
info:
  title: newsscore
  version: 1.0.0
  description: |
    NewsScore API: skor langsung dan berita sepak bola.

    All errors use the `Error` schema. Every response carries an `X-Request-ID`
    header (client-supplied if it matches `^[A-Za-z0-9._-]{1,64}$`, otherwise generated).

servers:
  - url: http://localhost:8080
    description: Local

tags:
  - name: health
    description: Liveness and readiness probes for orchestrators and load balancers.

security: []

paths:
  /health:
    get:
      tags: [health]
      operationId: liveness
      summary: Liveness probe
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProbeStatus" }

  /ready:
    get:
      tags: [health]
      operationId: readiness
      summary: Readiness probe (checks the database; fails while draining)
      responses:
        "200":
          description: Ready to receive traffic
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProbeStatus" }
        "503":
          description: Not ready (`not_ready`) or shutting down (`shutting_down`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProbeStatus" }

components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Required on write endpoints outside `APP_ENV=development`.

  schemas:
    ProbeStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, ready, not_ready, shutting_down]

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              examples: [VALIDATION_ERROR, NOT_FOUND, RATE_LIMITED]
            message:
              type: string

  responses:
    BadRequest:
      description: "Invalid input (`VALIDATION_ERROR`, `CLIENT_IP_UNRESOLVED`)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or invalid API key (`UNAUTHORIZED`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: "`NOT_FOUND`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PayloadTooLarge:
      description: Body over 1 MiB (`REQUEST_BODY_TOO_LARGE`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Per-client-IP rate limit exceeded (`RATE_LIMITED`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InternalError:
      description: "Unexpected failure (`INTERNAL_SERVER_ERROR`)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
