openapi: 3.1.0
info:
  title: newsscore
  version: 1.0.0
  description: |
    NewsScore API: skor langsung dan berita sepak bola.

    All errors use the `Error` schema. Every response carries an `X-Request-ID`
    header (client-supplied if it matches `^[A-Za-z0-9._-]{1,64}$`, otherwise generated).

servers:
  - url: http://localhost:8080
    description: Local

tags:
  - name: auth
    description: "Login with an HttpOnly session cookie (`session`). Browsers must send `credentials: include`."
  - name: news
    description: Berita. `/admin/news` needs a session with the admin role.
  - name: standings
    description: League table, computed from finished matches.
  - name: matches
    description: Pertandingan sepak bola. Tanggal dalam zona WIB.
  - name: health
    description: Liveness and readiness probes for orchestrators and load balancers.

security: []

paths:
  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Sign in; sets the session cookie
      description: Limited to 10 attempts per IP per minute.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, maxLength: 1024 }
      responses:
        "200":
          description: Signed in
          headers:
            Set-Cookie:
              description: "`session=<token>; HttpOnly; SameSite=Lax; Secure` (Secure outside development)"
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [user]
                    properties:
                      user: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Wrong email or password (`INVALID_CREDENTIALS`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Sign out; deletes the session and clears the cookie
      responses:
        "204": { description: Signed out (also when no session was present) }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/me:
    get:
      tags: [auth]
      operationId: me
      summary: The signed-in user
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/news:
    get:
      tags: [news]
      operationId: listNews
      summary: Published news, newest first
      parameters:
        - { name: matchId, in: query, schema: { type: string, format: uuid } }
        - { name: teamId, in: query, schema: { type: string, format: uuid } }
        - { name: playerId, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: cursor, in: query, description: "`meta.nextCursor` from the previous page", schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/NewsItem" } }
                  meta:
                    type: object
                    required: [nextCursor]
                    properties:
                      nextCursor: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/news/{slug}:
    get:
      tags: [news]
      operationId: getNews
      summary: One published article with its body
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf:
                      - $ref: "#/components/schemas/NewsItem"
                      - type: object
                        required: [body]
                        properties:
                          body: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/admin/news:
    get:
      tags: [news]
      operationId: adminListNews
      summary: Latest 100 articles, drafts included
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/AdminNews" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [news]
      operationId: adminCreateNews
      summary: Create an article (draft unless `published`)
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewsWrite" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/AdminNews" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/SlugTaken" }

  /api/v1/admin/news/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [news]
      operationId: adminGetNews
      summary: One article with body and links, draft or not
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/AdminNews" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [news]
      operationId: adminUpdateNews
      summary: Replace fields and links; `published` keeps the first publish time
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewsWrite" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/AdminNews" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/SlugTaken" }
    delete:
      tags: [news]
      operationId: adminDeleteNews
      summary: Delete an article and its links
      security: [{ sessionCookie: [] }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/standings:
    get:
      tags: [standings]
      operationId: getStandings
      summary: League table for a season
      description: Ranked by points, goal difference, then goals scored. Teams with no finished match yet appear with zeros.
      parameters:
        - { name: season, in: query, description: Year; defaults to the latest season with matches, schema: { type: integer, example: 2026 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [season, rows]
                    properties:
                      season: { type: integer }
                      rows: { type: array, items: { $ref: "#/components/schemas/StandingRow" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/matches:
    get:
      tags: [matches]
      operationId: listMatches
      summary: Pertandingan pada satu tanggal (WIB), urut jam kick-off
      parameters:
        - { name: date, in: query, description: "`DD.MM.YYYY`, default hari ini (WIB)", schema: { type: string, example: "14.09.2026" } }
        - { name: teamId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/MatchStatus" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Match" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/matches/stream:
    get:
      tags: [matches]
      operationId: streamMatches
      summary: Server-Sent Events for live matches
      description: |
        One stream for every match; clients filter by `id`/`matchId`. Events:

        - `score`: `ScoreUpdate`, sent when status, stage, or score changes.
        - `match_event`: `MatchEventUpdate`, sent when a new incident is recorded.

        A `: ping` comment arrives every 20s. The server closes streams after 30 minutes
        and on deploy; `EventSource` reconnects on its own (`retry: 3000`). Events missed
        while disconnected are not replayed, so refetch `/api/v1/matches` after reconnecting.
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema: { type: string }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503":
          description: Server is shutting down

  /api/v1/matches/{id}:
    get:
      tags: [matches]
      operationId: getMatch
      summary: Detail pertandingan dengan kejadian dan statistik
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/MatchDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /health:
    get:
      tags: [health]
      operationId: liveness
      summary: Liveness probe
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProbeStatus" }

  /ready:
    get:
      tags: [health]
      operationId: readiness
      summary: Readiness probe (checks the database; fails while draining)
      responses:
        "200":
          description: Ready to receive traffic
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProbeStatus" }
        "503":
          description: Not ready (`not_ready`) or shutting down (`shutting_down`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProbeStatus" }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Required on write endpoints outside `APP_ENV=development`.

  schemas:
    StandingRow:
      type: object
      required: [position, teamId, team, badge, played, won, drawn, lost, goalsFor, goalsAgainst, points, form]
      properties:
        position: { type: integer }
        teamId: { type: string, format: uuid }
        team: { type: string }
        badge: { type: string }
        logo: { type: string, format: uri }
        played: { type: integer }
        won: { type: integer }
        drawn: { type: integer }
        lost: { type: integer }
        goalsFor: { type: integer }
        goalsAgainst: { type: integer }
        points: { type: integer }
        form:
          type: array
          description: Last five results, newest first
          maxItems: 5
          items: { type: string, enum: [W, D, L] }

    NewsItem:
      type: object
      required: [id, category, title, summary, published, publishedAt]
      properties:
        id: { type: string, description: Slug }
        category: { type: string }
        title: { type: string }
        summary: { type: string }
        image: { type: string, format: uri }
        published: { type: string, description: 'Relative label: "baru saja", "2 jam lalu", or DD.MM.YYYY' }
        publishedAt: { type: string, format: date-time }

    NewsLinks:
      type: object
      properties:
        matchIds: { type: array, items: { type: string, format: uuid } }
        teamIds: { type: array, items: { type: string, format: uuid } }
        playerIds: { type: array, items: { type: string, format: uuid } }

    NewsWrite:
      type: object
      required: [title, category]
      properties:
        slug: { type: string, description: Derived from the title when empty }
        title: { type: string, maxLength: 200 }
        category: { type: string, maxLength: 40 }
        summary: { type: string, maxLength: 500 }
        body: { type: string }
        image: { type: string, description: https URL }
        published: { type: boolean, default: false }
        links: { $ref: "#/components/schemas/NewsLinks" }

    AdminNews:
      type: object
      required: [id, slug, category, title, publishedAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        category: { type: string }
        title: { type: string }
        summary: { type: string }
        body: { type: string }
        image: { type: string }
        publishedAt: { type: [string, "null"], format: date-time, description: null = draft }
        updatedAt: { type: string, format: date-time }
        links: { $ref: "#/components/schemas/NewsLinks" }

    User:
      type: object
      required: [id, email, name]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }

    MatchStatus:
      type: string
      enum: [scheduled, live, finished]

    Team:
      type: object
      required: [id, name, badge]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        badge: { type: string, description: 'Kode singkat, mis. "PER"' }
        logo: { type: string, format: uri }

    Match:
      type: object
      required: [id, status, time, date, home, away, score]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/MatchStatus" }
        time: { type: string, description: 'Jam kick-off WIB "HH:MM", atau "LIVE"' }
        date: { type: string, description: '"DD.MM.YYYY" (WIB)' }
        home: { $ref: "#/components/schemas/Team" }
        away: { $ref: "#/components/schemas/Team" }
        score:
          type: [array, "null"]
          items: { type: integer }
          minItems: 2
          maxItems: 2

    ScoreUpdate:
      type: object
      required: [id, status, time, score]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/MatchStatus" }
        time:
          type: string
          description: Menit berjalan saat live (`67'`, `HT`, `90+'`), kosong bila tidak live
        score:
          type: [array, "null"]
          items: { type: integer }
          minItems: 2
          maxItems: 2

    MatchEventUpdate:
      type: object
      required: [matchId, minute, team, type, player]
      properties:
        matchId: { type: string, format: uuid }
        minute: { type: string }
        team: { type: string, enum: [home, away, ""] }
        type: { type: string }
        player: { type: string }

    MatchDetail:
      allOf:
        - $ref: "#/components/schemas/Match"
        - type: object
          required: [events, stats]
          properties:
            events:
              type: array
              items:
                type: object
                required: [minute, team, type, player]
                properties:
                  minute: { type: string, example: "45+2'" }
                  team: { type: string, enum: [home, away, ""] }
                  type: { type: string, description: "goal, yellow, red, sub, atau jenis mentah dari sumber" }
                  player: { type: string }
            stats:
              type: array
              items:
                type: object
                properties:
                  label: { type: string }
                  home: { type: string }
                  away: { type: string }

    ProbeStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, ready, not_ready, shutting_down]

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              examples: [VALIDATION_ERROR, NOT_FOUND, RATE_LIMITED]
            message:
              type: string

  responses:
    BadRequest:
      description: "Invalid input (`VALIDATION_ERROR`, `CLIENT_IP_UNRESOLVED`)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Not signed in or session expired (`UNAUTHORIZED`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Signed in without the admin role (`FORBIDDEN`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    SlugTaken:
      description: Another article uses this slug (`NEWS_SLUG_TAKEN`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: "`NOT_FOUND`, `MATCH_NOT_FOUND`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PayloadTooLarge:
      description: Body over 1 MiB (`REQUEST_BODY_TOO_LARGE`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Per-client-IP rate limit exceeded (`RATE_LIMITED`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InternalError:
      description: "Unexpected failure (`INTERNAL_SERVER_ERROR`, `MATCH_QUERY_FAILED`)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
