name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)" || (gofmt -l cmd internal && exit 1)
      - name: go vet
        run: go vet ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  sqlc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: "1.31.1"
      - name: generated code is up to date
        run: sqlc diff

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: OpenAPI lint
        run: make openapi-lint
      - name: Prometheus rules check + unit tests
        run: make alerts-test

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: newsscore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d newsscore"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/newsscore?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: migrations up, down, up
        run: |
          make migrate-up
          docker run --rm --network host -v "$PWD/db/migrations:/migrations:ro" migrate/migrate:v4.20.1 \
            -path=/migrations -database "$DATABASE_URL" down -all
          make migrate-up
      - name: test (unit + integration)
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: go test -race -coverprofile=coverage.out ./...
      - name: coverage
        run: go tool cover -func=coverage.out | tail -1

  image:
    runs-on: ubuntu-latest
    needs: [lint, sqlc, contracts, test]
    steps:
      - uses: actions/checkout@v7
      - name: build
        run: docker build --build-arg VERSION=${{ github.sha }} -t newsscore:${{ github.sha }} .
      - name: scan
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.66.0 \
            image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed newsscore:${{ github.sha }}
